name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Print Prettier diff for ILR CSS
        run: |
          npx prettier --write src/styles/pages/ilr.css
          git diff -- src/styles/pages/ilr.css
          exit 1

  playwright-mobile:
    if: false
    name: Playwright mobile tests
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped

  playwright-desktop:
    if: false
    name: Playwright desktop tests
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped

  playwright-pages:
    if: false
    name: GitHub Pages production PWA tests
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped
