name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write src/features/ilr/components/ilr-journey-page.ts src/features/ilr/domain/ilr-outstanding-information.ts
          git diff -- src/features/ilr/components/ilr-journey-page.ts src/features/ilr/domain/ilr-outstanding-information.ts
          exit 1

  playwright-mobile:
    name: Playwright mobile tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run mobile Playwright tests
        run: npm run test:e2e -- --project=mobile-chromium
      - name: Upload mobile Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-report
          path: playwright-report/
          retention-days: 7

  playwright-desktop:
    name: Playwright desktop tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run desktop Playwright tests
        run: npm run test:e2e -- --project=desktop-chromium
      - name: Upload desktop Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-desktop-report
          path: playwright-report/
          retention-days: 7

  playwright-pages:
    name: GitHub Pages production PWA tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test GitHub Pages production subpath
        run: npm run test:pages
      - name: Upload Pages Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pages-report
          path: playwright-report/
          retention-days: 7
