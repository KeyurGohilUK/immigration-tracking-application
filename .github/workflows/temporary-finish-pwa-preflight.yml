name: Temporary finish PWA formatter

on:
  push:
    branches:
      - test/finish-pwa-hardening

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write playwright.pages.config.ts scripts/check-proprietary-notices.mjs scripts/check-repository-safety.mjs tests/pages/github-pages.spec.ts
          git diff -- playwright.pages.config.ts scripts/check-proprietary-notices.mjs scripts/check-repository-safety.mjs tests/pages/github-pages.spec.ts
