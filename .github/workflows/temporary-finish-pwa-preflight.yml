name: Temporary finish PWA formatter

on:
  push:
    branches:
      - test/finish-pwa-hardening

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write public/service-worker.js
          git diff -- public/service-worker.js
