name: Temporary network privacy preflight

on:
  push:
    branches:
      - test/network-privacy-regression

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npx playwright test tests/e2e/network-privacy.spec.ts --project=mobile-chromium
