name: Temporary accessibility formatter

on:
  push:
    branches:
      - test/accessibility-hardening

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write tests/e2e/accessibility.spec.ts
          git diff -- tests/e2e/accessibility.spec.ts
