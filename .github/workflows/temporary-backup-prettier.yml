name: Temporary backup formatter

on:
  push:
    branches:
      - test/backup-restore-hardening

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write src/features/backup/services/backup-service.test.ts
          git diff -- src/features/backup/services/backup-service.test.ts
