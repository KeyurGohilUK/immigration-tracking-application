name: Temporary formatter diagnostic

on:
  push:
    branches:
      - feature/complete-calculation-correctness

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write src/features/calculation/domain/absence-calculation.ts
          git diff -- src/features/calculation/domain/absence-calculation.ts
