name: Format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  show-prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write src/features/documents/components/life-english-dialog.ts
          git diff -- src/features/documents/components/life-english-dialog.ts
