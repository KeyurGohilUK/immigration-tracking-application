name: Temporary family isolation formatter

on:
  push:
    branches:
      - test/family-member-isolation

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write src/app/start-application.ts src/features/documents/data/document-repository.ts src/infrastructure/storage/record-repositories.test.ts tests/e2e/family-isolation.spec.ts
          git diff -- src/app/start-application.ts src/features/documents/data/document-repository.ts src/infrastructure/storage/record-repositories.test.ts tests/e2e/family-isolation.spec.ts
