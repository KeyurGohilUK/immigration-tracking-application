name: Temporary legacy backup formatter

on:
  push:
    branches:
      - test/legacy-backup-restore

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/features/backup/services/backup-migration.ts
          git diff -- src/features/backup/services/backup-migration.ts
